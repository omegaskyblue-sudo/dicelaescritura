services:
  - type: web
    name: estudio-faceless
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ACCESS_PASSWORD
        sync: false
