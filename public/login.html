<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#15171a">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="YAiContenido">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>YAiContenido · Acceso</title>
    <link rel="stylesheet" href="plataforma.css">
</head>
<body>
<header class="top">
    <h1>YAi<span>Contenido</span></h1>
</header>
<main>
    <form id="form" class="panel active login">
        <h2>Iniciar sesión</h2>
        <label>Usuario <input name="nombre" autocomplete="username" required autofocus></label>
        <label>Contraseña <input name="password" type="password" autocomplete="current-password" required></label>
        <button>Entrar</button>
        <p id="error" class="error" role="alert"></p>
    </form>
</main>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const datos = Object.fromEntries(new FormData(e.target));
    const err = document.getElementById('error');
    err.textContent = '';
    try {
        const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) });
        if (res.ok) { location.href = '/plataforma.html'; return; }
        err.textContent = (await res.json().catch(() => ({}))).error || 'No se pudo iniciar sesión';
    } catch { err.textContent = 'Servidor no disponible'; }
});
</script>
<script src="/app.js"></script>
</body>
</html>
